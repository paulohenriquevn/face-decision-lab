[project]
name = "face-decision-lab"
version = "0.1.0"
description = "Research lab for a decision model that flags presentation attacks and deepfakes in face captures."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Face cropping from videos. Heavy (TensorFlow), so it stays out of the core install.
extract = [
    "deepface>=0.0.93",
    "opencv-python>=4.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/face_decision_lab"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# The install cell is copied verbatim from Unsloth's Colab notebooks, which pin a working setup.
"notebooks/*.ipynb" = ["I001", "E401", "E501", "E701", "E702", "E722"]
