[project]
name = "face-decision-lab"
version = "0.1.0"
description = "Research lab for a decision model that flags presentation attacks and deepfakes in face captures."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Dataset build: face detection and the Hugging Face upload.
build = [
    "datasets>=3",
    "huggingface_hub>=0.30",
    "retina-face>=0.0.19",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # CPU build only, to unit test the training losses; Colab brings its own CUDA build.
    "torch>=2.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/face_decision_lab"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# The dataset card template holds Markdown table rows.
"src/face_decision_lab/hub.py" = ["E501"]
# The install cell is copied verbatim from Unsloth's Colab notebooks, which pin a working setup.
"notebooks/*.ipynb" = ["I001", "E401", "E501", "E701", "E702", "E722"]
